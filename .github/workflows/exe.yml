name: Windows executable

on:
  release:
    types:
      - published

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  exe:
    name: Build and attach the Windows zip
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build the executable
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pyinstaller
          python -m PyInstaller --noconfirm --onedir --console --name Spicebag \
              --collect-data spicebag --collect-data mnemonic --collect-data shamir_mnemonic \
              --copy-metadata spicebag --icon docs/assets/spicebag.ico \
              spicebag/__main__.py

      - name: Smoke test the executable
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          dist/Spicebag/Spicebag.exe --help
          test "$(dist/Spicebag/Spicebag.exe --version)" = "Spicebag ${TAG#v}"

      - name: Zip the folder
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: cd dist && python -m zipfile -c "Spicebag-${TAG#v}-windows.zip" Spicebag

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" "dist/Spicebag-${TAG#v}-windows.zip" --clobber