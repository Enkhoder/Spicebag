[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "spicebag"
version = "4.0.0"
description = "Visual Mnemonic Encoder / Decoder"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Enkhoder" }]
keywords = ["mnemonic", "bip39", "slip39", "electrum", "seed phrase", "steganography", "tui", "crypto"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security :: Cryptography",
    "Topic :: Utilities"
]
dynamic = ["dependencies"]

[project.urls]
Homepage = "https://github.com/Enkhoder/Spicebag"
Repository = "https://github.com/Enkhoder/Spicebag"
Issues = "https://github.com/Enkhoder/Spicebag/issues"

[project.scripts]
spicebag = "spicebag.frontend.entry:app"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
include = ["spicebag*"]

[tool.setuptools.package-data]
"spicebag.frontend" = ["*.tcss"]